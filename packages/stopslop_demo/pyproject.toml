[project]
name = "stopslop_demo"
version = "0.1.0"
description = "Interactive NVIDIA chat with local policy routing"
requires-python = ">=3.14"
dependencies = ["stopslop", "openai>=2", "httpx>=0.28"]
[project.scripts]
stopslop-demo = "stopslop_demo.cli:main"
[tool.uv.sources]
stopslop = { workspace = true }
[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"
