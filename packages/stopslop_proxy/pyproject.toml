[project]
name = "stopslop-proxy"
version = "0.1.0"
description = "Policy-enforced OpenAI, NVIDIA and Ollama HTTP gateway"
requires-python = ">=3.14"
dependencies = ["stopslop", "fastapi>=0.115", "uvicorn>=0.30"]
[project.scripts]
stopslop-proxy = "stopslop_proxy.cli:main"
[tool.uv.sources]
stopslop = { workspace = true }
[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"
